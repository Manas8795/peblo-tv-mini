name: CI / CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # --------------------------------------------------------------------------
  # 1. Backend Lint & Tests
  # --------------------------------------------------------------------------
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r peblo-tv-mini/api/requirements.txt
          pip install pytest flake8

      - name: Lint Backend Code
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 peblo-tv-mini/api --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest Suite (Artwork, Atomicity, Content Group, Roles, Search)
        working-directory: ./peblo-tv-mini/api
        run: |
          pytest tests -v

  # --------------------------------------------------------------------------
  # 2. Frontend Validation & Builds (CMS & Viewer)
  # --------------------------------------------------------------------------
  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            peblo-tv-mini/cms/package.json
            peblo-tv-mini/viewer/package.json

      - name: Typecheck and Build CMS
        working-directory: ./peblo-tv-mini/cms
        run: |
          npm ci
          npm run build

      - name: Typecheck and Build Viewer
        working-directory: ./peblo-tv-mini/viewer
        run: |
          npm ci
          npm run build

  # --------------------------------------------------------------------------
  # 3. Docker Container Image Builds
  # --------------------------------------------------------------------------
  docker-build:
    name: Build Container Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: ./peblo-tv-mini/api
          push: false
          tags: peblo-api:${{ github.sha }}

      - name: Build CMS Image
        uses: docker/build-push-action@v5
        with:
          context: ./peblo-tv-mini/cms
          push: false
          tags: peblo-cms:${{ github.sha }}

      - name: Build Viewer Image
        uses: docker/build-push-action@v5
        with:
          context: ./peblo-tv-mini/viewer
          push: false
          tags: peblo-viewer:${{ github.sha }}

  # --------------------------------------------------------------------------
  # 4. Production Deployment Step (Explained & Simulated)
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deployment Execution
        run: |
          echo "================================================================="
          echo "DEPLOYMENT STRATEGY EXPLANATION (Part D.2):"
          echo "1. In production, built container images are tagged with git SHA"
          echo "   and pushed to an artifact registry (e.g. AWS ECR / Cloudflare / DockerHub)."
          echo "2. The deployment runner authenticates against the target cluster (e.g."
          echo "   Kubernetes / AWS ECS / Google Cloud Run) via OpenID Connect (OIDC) tokens."
          echo "3. Zero-downtime rolling deployment is performed:"
          echo "   - New API containers spin up and pass /health checks before traffic cutover."
          echo "   - Database migrations (alembic upgrade head) execute as an init-job."
          echo "   - Static Viewer & CMS frontend bundles are deployed to Cloudflare Pages/CDN."
          echo "================================================================="
          echo "Deployment simulation completed successfully for commit ${{ github.sha }}."
